version: 2
project_name: sinq

builds:
  - id: sinq
    main: ./cmd/sinq
    binary: sinq
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X "main.versionConstPart=sinq {{.Tag}} - "
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}-{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}'
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE.md
      - sinq.1
      - cmd/sinq/completions/sinq.bash
      - cmd/sinq/completions/_sinq
      - cmd/sinq/completions/sinq.fish
      - cmd/sinq/completions/sinq.ps1

nfpms:
  - id: packages
    maintainer: Veitangie
    description: A concurrent HTTP functional and integration testing tool.
    homepage: https://github.com/Veitangie/sinq
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: sinq.1
        dst: /usr/share/man/man1/sinq.1
        file_info:
          mode: 0644
      - src: cmd/sinq/completions/sinq.bash
        dst: /usr/share/bash-completion/completions/sinq
        file_info:
          mode: 0644
      - src: cmd/sinq/completions/_sinq
        dst: /usr/share/zsh/vendor-completions/_sinq
        file_info:
          mode: 0644
      - src: cmd/sinq/completions/sinq.fish
        dst: /usr/share/fish/vendor_completions.d/sinq.fish
        file_info:
          mode: 0644

homebrew_casks:
  - name: sinq-bin
    repository:
      owner: Veitangie
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Veitangie/sinq
    description: A concurrent HTTP functional and integration testing tool.
    license: GPL-3.0-or-later
    manpages:
      - sinq.1

