nix:
  - name: sinq
    repository:
      owner: Veitangie
      name: sinq-nix
      token: "{{ .Env.NIX_GITHUB_TOKEN }}"
    homepage: https://github.com/Veitangie/sinq
    description: A concurrent HTTP functional and integration testing tool.
    license: gpl3Plus

dockers_v2:
  - images:
      - ghcr.io/veitangie/sinq
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"

scoops:
  - name: sinq
    homepage: https://github.com/Veitangie/sinq
    description: A concurrent HTTP functional and integration testing tool.
    license: GPL-3.0-or-later
    goamd64: v3
    repository:
      owner: Veitangie
      name: scoop-bucket
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"

