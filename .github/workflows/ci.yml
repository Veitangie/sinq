name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
    paths:
      - 'cmd/**'
      - 'examples/**'
      - 'internal/**'
      - 'test-all'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

      - name: Run tests
        run: ./test-all

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt

  release:
    name: Build, Pack & Publish
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate Man Page
        run: |
          go install github.com/cpuguy83/go-md2man/v2@latest
          go-md2man -in=docs/man.md -out=sinq.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU & Docker Buildx
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add AUR to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          NIX_GITHUB_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt

  update-aur:
    name: Update AUR (Source Package)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git openssh pacman-contrib

      - name: Setup SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat <<EOF > ~/.ssh/config
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          
          mkdir -p /root/.ssh
          cp -r ~/.ssh/* /root/.ssh/

      - name: Clone AUR Repo
        run: git clone ssh://aur@aur.archlinux.org/sinq.git aur-repo

      - name: Update PKGBUILD
        run: |
          cd aur-repo
          
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PKGVER=$(echo "${TAG_NAME#v}" | tr '-' '_')
          
          sed -i "s/^_tag=.*/_tag=$TAG_NAME/" PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Update Checksums and SRCINFO
        run: |
          cd aur-repo
          git config --global --add safe.directory '*'
          useradd -m builder
          chown -R builder:builder .
          su builder -c "updpkgsums"
          su builder -c "makepkg --printsrcinfo > .SRCINFO"
          chown -R root:root .

      - name: Commit and Push
        run: |
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update to $GITHUB_REF_NAME"
            git push
          fi

  update-brew:
    name: Update Homebrew (Source Formula)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Homebrew Tap
        uses: actions/checkout@v6
        with:
          repository: Veitangie/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          cd homebrew-tap
          mkdir -p Formula
          
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TARBALL_URL="https://github.com/Veitangie/sinq/archive/refs/tags/${TAG_NAME}.tar.gz"
          
          SHA256=$(curl -fSL "$TARBALL_URL" | sha256sum | awk '{print $1}')
          
          cat <<EOF > Formula/sinq.rb
          class Sinq < Formula
            desc "A concurrent HTTP functional and integration testing tool."
            homepage "https://github.com/Veitangie/sinq"
            url "$TARBALL_URL"
            sha256 "$SHA256"
            license "GPL-3.0-or-later"

            depends_on "go" => :build
            depends_on "go-md2man" => :build

            def install
              system "go", "build", "-trimpath", "-ldflags", "-s -w -X 'main.versionConstPart=sinq ${GITHUB_REF_NAME} - '", "-o", bin/"sinq", "./cmd/sinq"
              system "go-md2man", "-in", "docs/man.md", "-out", "sinq.1"
              man1.install "sinq.1"
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sinq.rb
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Brew formula update for sinq version $GITHUB_REF_NAME"
            git push
          fi
