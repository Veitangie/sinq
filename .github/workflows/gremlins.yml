name: Mutation Testing Badge

# DISABLED. gremlins can't complete a run on GitHub hosted runners - the runner
# VM is killed mid-run every time, surfacing as a "send on closed channel" panic
# in gremlins' signal handler. Tried worker/cpu/timeout limits, moving the build
# cache to /mnt, pinning gremlins past v0.6.0, and excluding the parser files;
# none helped. Re-enable by restoring the `schedule` trigger and removing the
# `if: false` below once it can run reliably (bigger runner, or self-hosted).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gremlins:
    name: Update test efficacy badge
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sinq source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: sinq

      - name: Checkout badge repo
        uses: actions/checkout@v6
        with:
          repository: Veitangie/assets
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: assets

      - name: Check for Go changes since the last badge update
        id: check
        run: |
          marker="assets/badges/sinq/last-commit.txt"
          if [ -f "$marker" ]; then
            last="$(cat "$marker")"
            changed="$(git -C sinq diff --name-only "$last" HEAD -- '*.go')"
            if [ -z "$changed" ]; then
              echo "No .go changes since $last - skipping this week's run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: 'sinq/go.mod'
          cache: true
          cache-dependency-path: sinq/go.sum

      - name: Install gremlins
        if: steps.check.outputs.skip != 'true'
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@b48a4aad17

      - name: Run mutation testing
        id: mutation
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 50
        working-directory: sinq
        env:
          GOCACHE: /mnt/gocache
          TMPDIR: /mnt/tmp
        run: |
          sudo mkdir -p /mnt/gocache /mnt/tmp
          sudo chown "$USER" /mnt/gocache /mnt/tmp
          chmod 1777 /mnt/tmp
          df -h / /mnt
          gremlins unleash \
            --workers 1 --test-cpu 1 --timeout-coefficient 3 \
            -E '(scenario-parser|internal/runner/parser|byte-scanner)\.go$' \
            -o ../gremlins-report.json .
          df -h / /mnt

      - name: Generate badge JSON
        if: steps.check.outputs.skip != 'true'
        run: |
          if ! jq -e '.test_efficacy' gremlins-report.json >/dev/null 2>&1; then
            echo "::warning::gremlins did not produce a usable report; leaving the badge unchanged."
            exit 0
          fi
          mkdir -p assets/badges/sinq
          # floor, not round - that's the house convention for this metric
          efficacy="$(jq '.test_efficacy | floor' gremlins-report.json)"
          message="${efficacy}%"
          color="red"
          if [ "$efficacy" -ge 90 ]; then
            color="brightgreen"
          elif [ "$efficacy" -ge 75 ]; then
            color="yellow"
          fi
          jq -n --arg label "test efficacy" --arg message "$message" --arg color "$color" \
            '{schemaVersion: 1, label: $label, message: $message, color: $color}' \
            > assets/badges/sinq/gremlins.json
          git -C sinq rev-parse HEAD > assets/badges/sinq/last-commit.txt

      - name: Commit and push badge update
        if: steps.check.outputs.skip != 'true'
        working-directory: assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/sinq/gremlins.json badges/sinq/last-commit.txt
          if git diff --cached --quiet; then
            echo "Badge unchanged, nothing to commit."
          else
            git commit -m "chore(sinq): update test efficacy badge"
            git push
          fi
